services:
    redis:
        image: redis:alpine
        container_name: locutus-redis
        command: redis-server --requirepass ${REDIS_PASSWORD:-devpassword}
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD:-devpassword}
        deploy:
            resources:
                limits:
                    memory: 256M
                    cpus: "0.5"
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-devpassword}", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: unless-stopped

volumes:
    redis_data:
