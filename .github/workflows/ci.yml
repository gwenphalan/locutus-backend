name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x]

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"

            - name: Enable pnpm
              run: |
                  corepack enable
                  corepack prepare pnpm@10.30.3 --activate

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Format Check
              run: pnpm format:check

            - name: Typecheck
              run: pnpm typecheck

            - name: Run Tests
              run: pnpm test

            - name: Build
              run: pnpm build
